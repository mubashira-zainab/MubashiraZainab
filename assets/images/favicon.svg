      <stop offset="0%" stop-color="#3D271D"/>
      <stop offset="50%" stop-color="#8C624A"/>
      <stop offset="100%" stop-color="#C89D7C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
